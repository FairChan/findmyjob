<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FindMYJob · 离线 / Offline</title>
  <style>
    *,*::before,*::after{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',
        'Noto Sans SC',system-ui,sans-serif;
      display:flex;justify-content:center;align-items:center;
      min-height:100vh;background:#f8fafc;color:#1e293b;
    }
    .card{
      text-align:center;padding:2rem 1.5rem;max-width:340px;width:100%;
    }
    .icon{margin:0 auto 1.25rem;color:#94a3b8}
    h1{font-size:1.25rem;font-weight:600;margin:0 0 0.5rem}
    p{color:#64748b;font-size:0.875rem;line-height:1.6;margin:0 0 1.5rem}
    button{
      background:#0066cc;color:#fff;border:none;border-radius:999px;
      padding:0.625rem 1.5rem;font-size:0.875rem;font-weight:500;
      cursor:pointer;min-height:40px;min-width:120px;
    }
    button:hover{opacity:0.9}
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48"
      fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"
      aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M13.181 8.68a4.503 4.503 0 0 0-4.978 1.085 4.5 4.5 0 0 0 1.332 7.188
           4.503 4.503 0 0 0 5.253-1.045M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25
           S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0zM12 10.5h.008v.008H12V10.5z" />
    </svg>
    <h1>当前离线 / You are offline</h1>
    <p>
      请检查网络连接后重试。<br />
      Please check your connection and try again.
    </p>
    <button onclick="window.location.reload()">重试 / Retry</button>
  </div>
</body>
</html>
